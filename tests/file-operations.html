<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>MDEditor — операции с файлами</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="app-header">
    <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-expanded="false">≡</button>
    <div class="brand"><span class="brand-mark">MD</span><h1>MD</h1></div>
    <div class="segmented">
      <button type="button" id="mode-preview-button">Просмотр</button>
      <button type="button" id="mode-split-button">Вместе</button>
      <button type="button" id="mode-editor-button">Редактор</button>
    </div>
    <div class="header-settings">
      <select id="preview-font-select"><option value="Lato">Lato</option><option value="Inter">Inter</option><option value="Roboto">Roboto</option><option value="Liberation Sans">Liberation Sans</option><option value="Liberation Serif">Liberation Serif</option></select>
      <button type="button" id="preview-size-dec">−</button><span id="preview-size-value">17</span>
      <button type="button" id="preview-size-inc">+</button>
      <button type="button" id="editor-size-dec">−</button><span id="editor-size-value">14</span>
      <button type="button" id="editor-size-inc">+</button>
      <button type="button" id="theme-button" class="header-icon"></button>
      <button type="button" id="toc-button"><span>Оглавление</span></button>
      <button type="button" id="copy-doc-button"><span>Текст</span></button>
      <button type="button" id="download-zip-button"><span>ZIP</span></button>
    </div>
  </header>

  <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="pane-title"><span>Файлы</span>
        <div class="pane-actions">
          <button type="button" id="new-file-button">+</button>
          <button type="button" id="new-folder-button">D+</button>
          <button type="button" id="delete-all-button">X</button>
          <button type="button" id="upload-button">↑</button>
        </div>
      </div>
      <div class="file-search"><input id="file-search-input" type="search"></div>
      <div id="file-list" class="file-list"></div>
      <div class="sidebar-footer"><span id="status-line">…</span></div>
    </aside>
    <div id="sidebar-resizer" class="sidebar-resizer" tabindex="0" role="separator"
         aria-orientation="vertical" aria-label="Ширина панели файлов"
         aria-valuemin="210" aria-valuemax="520" aria-valuenow="280"></div>
    <main class="content" id="content">
      <div id="editor-pane" class="editor-pane" hidden>
        <div id="editor-toolbar" class="editor-toolbar" role="toolbar"></div>
        <div class="editor-surface">
          <pre id="editor-highlight" class="editor-highlight" aria-hidden="true"></pre>
          <textarea id="editor"></textarea>
        </div>
      </div>
      <div id="split-resizer" class="split-resizer" hidden></div>
      <div id="preview-pane" class="preview-pane"><div id="preview-body" class="markdown-body"></div></div>
      <aside id="toc-panel" class="toc-panel" hidden>
        <div class="toc-title">Оглавление</div><nav id="toc-list" class="toc-list"></nav>
      </aside>
      <div id="welcome-pane" class="welcome-pane" hidden><div class="welcome-card"></div></div>
    </main>
  </div>

  <div id="find-bar" class="find-bar" hidden>
    <input id="find-input" type="search">
    <span id="find-count" class="find-count"></span>
    <button type="button" id="find-prev">↑</button>
    <button type="button" id="find-next">↓</button>
    <button type="button" id="find-close">✕</button>
  </div>
  <div id="file-context-menu" class="context-menu" hidden></div>
  <div id="dialog-overlay" class="dialog-overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true">
      <p id="dialog-message"></p><div id="dialog-buttons" class="dialog-buttons"></div>
    </div>
  </div>
  <input id="upload-input" type="file" multiple hidden>
  <pre id="results" style="position:fixed;left:-99999px"></pre>
  <div id="host" style="position:fixed;left:-99999px;top:0"></div>

  <script src="../vendor/marked.min.js"></script>
  <script>
  (async () => {
    const out = []; let passed = 0, failed = 0;
    const flush = () => { document.getElementById('results').textContent = out.join('\n'); };
    const check = (name, ok, detail) => {
      ok ? passed++ : failed++;
      out.push((ok ? 'PASS  ' : 'FAIL  ') + name + (ok || !detail ? '' : '\n        → ' + detail));
      flush();
    };
    const step = (label) => { out.push('.. ' + label); flush(); };
    const el = (id) => document.getElementById(id);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    window.addEventListener('error', (e) => { out.push('ОШИБКА: ' + e.message); flush(); });

    await new Promise((resolve) => {
      const request = indexedDB.deleteDatabase('mdeditor');
      request.onsuccess = request.onerror = request.onblocked = () => resolve();
    });
    try {
      localStorage.removeItem('mdeditor-emergency');
      localStorage.removeItem('mdeditor-settings');
    } catch {}

    // перехватываем всё, что приложение отдаёт на скачивание
    let capturedBlob = null;
    let capturedName = null;
    const realCreateUrl = URL.createObjectURL.bind(URL);
    URL.createObjectURL = (blob) => { capturedBlob = blob; return realCreateUrl(blob); };
    const realAnchorClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function patched() {
      if (this.download) { capturedName = this.download; return; }
      return realAnchorClick.call(this);
    };

    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = '../js/app.js';
      script.onload = resolve; script.onerror = reject;
      document.body.appendChild(script);
    });
    for (let i = 0; i < 80 && el('file-list').children.length === 0; i++) await sleep(50);

    // ---- вспомогательное ----
    const rows = () => Array.from(document.querySelectorAll('#file-list .file-row'));
    const names = () => rows().map((r) => {
      const n = r.querySelector('.file-name');
      return (n ? n.textContent : '(ввод)') + (r.classList.contains('folder') ? '/' : '');
    });
    const rowByName = (name) => rows().find((r) => {
      const n = r.querySelector('.file-name');
      return n && n.textContent === name;
    });
    const menuItems = () => Array.from(document.querySelectorAll('#file-context-menu button'))
      .map((b) => b.textContent);

    async function openMenu(row) {
      row.querySelector('.file-menu-button').click();
      await sleep(60);
    }
    async function menuAction(row, label) {
      await openMenu(row);
      const button = Array.from(document.querySelectorAll('#file-context-menu button'))
        .find((b) => b.textContent === label);
      if (!button) return false;
      button.click();
      await sleep(200);
      return true;
    }
    async function commitName(name) {
      await sleep(60);
      const input = document.querySelector('.file-name-input');
      if (!input) return false;
      input.value = name;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      await sleep(120);
      return true;
    }
    async function answerDialog(label) {
      await sleep(80);
      const button = Array.from(el('dialog-buttons').querySelectorAll('button'))
        .find((b) => b.textContent === label);
      if (!button) return false;
      button.click();
      await sleep(200);
      return true;
    }

    // ================= создание через меню папки =================
    step('создаём папку и файл внутри неё через меню');
    el('new-folder-button').click();
    await commitName('раздел');
    check('папка создана', Boolean(rowByName('раздел')), names().join(' | '));

    const okNewFileHere = await menuAction(rowByName('раздел'), 'Новый файл здесь');
    check('в меню папки есть «Новый файл здесь»', okNewFileHere);
    await commitName('первый.md');
    check('файл появился внутри папки',
      Boolean(rowByName('первый.md'))
      && parseInt(rowByName('первый.md').querySelector('.file-main-button').style.paddingLeft, 10)
         > parseInt(rowByName('раздел').querySelector('.file-main-button').style.paddingLeft, 10),
      names().join(' | '));

    el('mode-editor-button').click();
    await sleep(120);
    el('editor').value = '# Первый\n\nСодержимое первого файла.\n';
    el('editor').dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(700);

    // ================= правое нажатие открывает то же меню =================
    step('контекстное меню правой кнопкой');
    closeAnyMenu();
    rowByName('первый.md').dispatchEvent(new MouseEvent('contextmenu',
      { bubbles: true, cancelable: true, clientX: 120, clientY: 200 }));
    await sleep(80);
    check('правое нажатие открывает меню', !el('file-context-menu').hidden);
    check('в меню файла полный набор действий',
      ['Переименовать', 'Дублировать', 'Скачать', 'Выгрузить в HTML', 'Удалить']
        .every((label) => menuItems().includes(label)),
      menuItems().join(' | '));
    function closeAnyMenu() {
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    }
    closeAnyMenu();
    await sleep(60);

    // ================= переименование через меню и отмена =================
    step('переименование через меню');
    const okRename = await menuAction(rowByName('первый.md'), 'Переименовать');
    check('пункт «Переименовать» открывает поле ввода',
      okRename && Boolean(document.querySelector('.file-name-input')));

    const input = document.querySelector('.file-name-input');
    input.value = '';
    input.dispatchEvent(new Event('input', { bubbles: true }));
    check('пустое имя помечено как недопустимое', input.classList.contains('invalid'));

    input.value = 'с/косой.md';
    input.dispatchEvent(new Event('input', { bubbles: true }));
    check('имя с косой чертой недопустимо', input.classList.contains('invalid'));

    input.value = 'переименованный.md';
    input.dispatchEvent(new Event('input', { bubbles: true }));
    check('нормальное имя допустимо', !input.classList.contains('invalid'));

    input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await sleep(120);
    check('Escape отменяет переименование', Boolean(rowByName('первый.md')), names().join(' | '));

    await menuAction(rowByName('первый.md'), 'Переименовать');
    await commitName('переименованный.md');
    check('переименование применяется',
      Boolean(rowByName('переименованный.md')) && !rowByName('первый.md'), names().join(' | '));

    // ================= дублирование =================
    step('дублирование');
    const okDup = await menuAction(rowByName('переименованный.md'), 'Дублировать');
    check('пункт «Дублировать» есть', okDup);
    const copyRow = rowByName('переименованный (копия).md');
    check('копия создана с понятным именем', Boolean(copyRow), names().join(' | '));
    check('копия лежит в той же папке',
      Boolean(copyRow) && copyRow.querySelector('.file-main-button').style.paddingLeft
        === rowByName('переименованный.md').querySelector('.file-main-button').style.paddingLeft);

    copyRow.querySelector('.file-main-button').click();
    await sleep(250);
    el('mode-preview-button').click();
    await sleep(250);
    check('содержимое скопировано', /Содержимое первого файла/.test(el('preview-body').textContent),
      el('preview-body').textContent.slice(0, 60));

    await menuAction(rowByName('переименованный.md'), 'Дублировать');
    check('вторая копия получает свободное имя',
      Boolean(rowByName('переименованный (копия)-2.md')), names().join(' | '));

    // ================= скачивание отдельного файла =================
    step('скачивание файла');
    capturedBlob = null; capturedName = null;
    const okDownload = await menuAction(rowByName('переименованный.md'), 'Скачать');
    check('пункт «Скачать» есть', okDownload);
    check('файл отдан с исходным именем', capturedName === 'переименованный.md', String(capturedName));
    const text = capturedBlob ? await capturedBlob.text() : '';
    check('отдано исходное содержимое, а не разметка превью',
      text === '# Первый\n\nСодержимое первого файла.\n', JSON.stringify(text.slice(0, 60)));

    // ================= выгрузка обычного файла в HTML =================
    step('выгрузка файла в HTML');
    capturedBlob = null; capturedName = null;
    const okExport = await menuAction(rowByName('переименованный.md'), 'Выгрузить в HTML');
    check('пункт «Выгрузить в HTML» есть и у обычного файла', okExport);
    check('страница названа по имени файла без расширения',
      capturedName === 'переименованный.html', String(capturedName));
    const page = capturedBlob ? await capturedBlob.text() : '';
    check('выгружена самодостаточная страница с содержимым файла',
      /^<!DOCTYPE html>/.test(page) && page.includes('<style>')
      && page.includes('<h1>Первый</h1>')
      && page.includes('Содержимое первого файла'),
      page.slice(page.indexOf('<main>'), page.indexOf('<main>') + 140));

    // ================= ZIP отдельной папки =================
    step('архив папки');
    capturedBlob = null; capturedName = null;
    const okFolderZip = await menuAction(rowByName('раздел'), 'Скачать папку в ZIP');
    check('пункт «Скачать папку в ZIP» есть', okFolderZip);
    for (let i = 0; i < 120 && !capturedBlob; i++) await sleep(50);
    check('архив собран', Boolean(capturedBlob) && capturedName === 'раздел.zip', String(capturedName));
    if (capturedBlob && window.JSZip) {
      const zip = await window.JSZip.loadAsync(capturedBlob);
      const entries = Object.keys(zip.files).sort();
      check('в архиве только содержимое этой папки, с её именем в пути',
        entries.every((n) => n.startsWith('раздел/')) && entries.some((n) => n === 'раздел/переименованный.md'),
        JSON.stringify(entries));
      check('справка в архив папки не попала',
        !entries.some((n) => n.includes('добро-пожаловать')), JSON.stringify(entries));
    }

    // ================= загрузка через кнопку =================
    step('загрузка файлов кнопкой');
    let inputOpened = 0;
    const realInputClick = el('upload-input').click.bind(el('upload-input'));
    el('upload-input').click = () => { inputOpened += 1; };
    el('upload-button').click();
    check('кнопка загрузки открывает выбор файла', inputOpened === 1, 'вызовов: ' + inputOpened);
    el('upload-input').click = realInputClick;

    const transfer = new DataTransfer();
    transfer.items.add(new File(['# Из кнопки\n\nЗагружено через поле выбора.\n'],
      'через-кнопку.md', { type: 'text/markdown' }));
    el('upload-input').files = transfer.files;
    el('upload-input').dispatchEvent(new Event('change', { bubbles: true }));
    await sleep(700);
    check('файл из поля выбора попал в дерево', Boolean(rowByName('через-кнопку.md')),
      names().join(' | '));

    // ================= простой дроп без записей файловой системы =================
    step('дроп без webkitGetAsEntry');
    const plain = {
      types: ['Files'],
      items: [],
      files: [new File(['# Простой дроп\n'], 'простой.md', { type: 'text/markdown' })],
    };
    const dropEvent = new DragEvent('drop', { bubbles: true, cancelable: true });
    Object.defineProperty(dropEvent, 'dataTransfer', { value: plain });
    el('file-list').dispatchEvent(dropEvent);
    await sleep(700);
    check('файл принят и без записей файловой системы', Boolean(rowByName('простой.md')),
      names().join(' | '));

    // ================= подсветка области при переносе =================
    step('подсветка области при переносе');
    const enterEvent = new DragEvent('dragenter', { bubbles: true, cancelable: true });
    Object.defineProperty(enterEvent, 'dataTransfer', { value: { types: ['Files'], items: [], files: [] } });
    el('file-list').dispatchEvent(enterEvent);
    await sleep(60);
    check('область приёма подсвечивается', el('file-list').classList.contains('drag-over'));

    const leaveEvent = new DragEvent('dragleave', { bubbles: true, cancelable: true });
    Object.defineProperty(leaveEvent, 'dataTransfer', { value: { types: ['Files'], items: [], files: [] } });
    el('file-list').dispatchEvent(leaveEvent);
    await sleep(60);
    check('подсветка снимается при уходе', !el('file-list').classList.contains('drag-over'));

    // ================= диалог закрывается нажатием вне окна =================
    step('закрытие диалога нажатием мимо');
    el('delete-all-button').click();
    await sleep(120);
    check('диалог открыт', !el('dialog-overlay').hidden);
    const before = names().length;
    el('dialog-overlay').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
    await sleep(200);
    check('нажатие вне окна закрывает диалог', el('dialog-overlay').hidden);
    check('и ничего при этом не удаляет', names().length === before,
      'было ' + before + ', стало ' + names().length);

    // ================= подсказка в пустом списке =================
    step('подсказка в пустом списке');
    el('delete-all-button').click();
    await answerDialog('Удалить всё');
    const hint = document.querySelector('#file-list .drop-hint');
    check('в пустом списке показана подсказка', Boolean(hint), names().join(' | '));
    inputOpened = 0;
    el('upload-input').click = () => { inputOpened += 1; };
    if (hint) hint.click();
    check('нажатие на подсказку открывает выбор файла', inputOpened === 1, 'вызовов: ' + inputOpened);
    el('upload-input').click = realInputClick;

    out.push('');
    out.push('ИТОГО: ' + passed + ' пройдено, ' + failed + ' провалено');
    flush();
    document.title = failed === 0 ? 'ALL-PASS' : 'FAILURES-' + failed;
  })().catch((error) => {
    document.getElementById('results').textContent += '\nИСКЛЮЧЕНИЕ: ' + (error && error.stack || error);
    document.title = 'FAILURES-CRASH';
  });
  </script>
</body>
</html>
