<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>MDEditor — устойчивость и остатки путей</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="app-header">
    <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-expanded="false">≡</button>
    <div class="brand"><span class="brand-mark">MD</span><h1>MD</h1></div>
    <div class="segmented">
      <button type="button" id="mode-preview-button">Просмотр</button>
      <button type="button" id="mode-split-button">Вместе</button>
      <button type="button" id="mode-editor-button">Редактор</button>
    </div>
    <div class="doc-bar">
      <span id="doc-path" class="doc-path"></span>
      <span id="doc-save" class="doc-save"></span>
      <span id="doc-stats" class="doc-stats"></span>
    </div>
    <div class="header-settings">
      <select id="preview-font-select"><option value="Lato">Lato</option><option value="Inter">Inter</option><option value="Roboto">Roboto</option><option value="Liberation Sans">Liberation Sans</option><option value="Liberation Serif">Liberation Serif</option></select>
      <button type="button" id="preview-size-dec">−</button><span id="preview-size-value">17</span>
      <button type="button" id="preview-size-inc">+</button>
      <button type="button" id="editor-size-dec">−</button><span id="editor-size-value">14</span>
      <button type="button" id="editor-size-inc">+</button>
      <button type="button" id="theme-button" class="header-icon"></button>
      <button type="button" id="toc-button"><span>Оглавление</span></button>
      <button type="button" id="copy-doc-button"><span>Текст</span></button>
      <button type="button" id="download-zip-button"><span>ZIP</span></button>
    </div>
  </header>

  <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="pane-title"><span>Файлы</span>
        <div class="pane-actions">
          <button type="button" id="new-file-button">+</button>
          <button type="button" id="new-folder-button">D+</button>
          <button type="button" id="delete-all-button">X</button>
          <button type="button" id="upload-button">↑</button>
        </div>
      </div>
      <div class="file-search"><input id="file-search-input" type="search"></div>
      <div id="file-list" class="file-list"></div>
      <div class="sidebar-footer"><span id="status-line">…</span></div>
    </aside>
    <div id="sidebar-resizer" class="sidebar-resizer" tabindex="0" role="separator"
         aria-orientation="vertical" aria-label="Ширина панели файлов"
         aria-valuemin="210" aria-valuemax="520" aria-valuenow="280"></div>
    <main class="content" id="content">
      <div id="editor-pane" class="editor-pane" hidden>
        <div id="editor-toolbar" class="editor-toolbar" role="toolbar"></div>
        <div class="editor-surface">
          <pre id="editor-highlight" class="editor-highlight" aria-hidden="true"></pre>
          <textarea id="editor"></textarea>
        </div>
      </div>
      <div id="split-resizer" class="split-resizer" hidden></div>
      <div id="preview-pane" class="preview-pane"><div id="preview-body" class="markdown-body"></div></div>
      <aside id="toc-panel" class="toc-panel" hidden>
        <div class="toc-title">Оглавление</div><nav id="toc-list" class="toc-list"></nav>
      </aside>
      <div id="welcome-pane" class="welcome-pane" hidden><div class="welcome-card"></div></div>
    </main>
  </div>

  <div id="find-bar" class="find-bar" hidden>
    <input id="find-input" type="search">
    <span id="find-count" class="find-count"></span>
    <button type="button" id="find-prev">↑</button>
    <button type="button" id="find-next">↓</button>
    <button type="button" id="find-close">✕</button>
  </div>
  <div id="file-context-menu" class="context-menu" hidden></div>
  <div id="dialog-overlay" class="dialog-overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true">
      <p id="dialog-message"></p><div id="dialog-buttons" class="dialog-buttons"></div>
    </div>
  </div>
  <input id="upload-input" type="file" multiple hidden>
  <pre id="results" style="position:fixed;left:-99999px"></pre>
  <div id="host" style="position:fixed;left:-99999px;top:0"></div>

  <script src="../vendor/marked.min.js"></script>
  <script>
  (async () => {
    const out = []; let passed = 0, failed = 0;
    const flush = () => { document.getElementById('results').textContent = out.join('\n'); };
    const check = (name, ok, detail) => {
      ok ? passed++ : failed++;
      out.push((ok ? 'PASS  ' : 'FAIL  ') + name + (ok || !detail ? '' : '\n        → ' + detail));
      flush();
    };
    const step = (label) => { out.push('.. ' + label); flush(); };
    const el = (id) => document.getElementById(id);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    window.addEventListener('error', (e) => { out.push('ОШИБКА: ' + e.message); flush(); });

    await new Promise((resolve) => {
      const request = indexedDB.deleteDatabase('mdeditor');
      request.onsuccess = request.onerror = request.onblocked = () => resolve();
    });
    try {
      localStorage.removeItem('mdeditor-settings');
      localStorage.removeItem('mdeditor-emergency');
    } catch {}

    // ================= работа без хранилища =================
    // Приложение обязано открыться и дать писать, даже если IndexedDB недоступна:
    // приватный режим, отключённое хранилище, переполненная квота.
    step('IndexedDB недоступна');
    const realIndexedDB = window.indexedDB;
    Object.defineProperty(window, 'indexedDB', { configurable: true, value: undefined });

    let capturedBlob = null;
    let capturedName = null;
    const realCreateUrl = URL.createObjectURL.bind(URL);
    URL.createObjectURL = (blob) => { capturedBlob = blob; return realCreateUrl(blob); };
    const realAnchorClick = HTMLAnchorElement.prototype.click;
    HTMLAnchorElement.prototype.click = function patched() {
      if (this.download) { capturedName = this.download; return; }
      return realAnchorClick.call(this);
    };

    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = '../js/app.js';
      script.onload = resolve; script.onerror = reject;
      document.body.appendChild(script);
    });
    for (let i = 0; i < 80 && el('file-list').children.length === 0; i++) await sleep(50);
    await sleep(400);

    const rows = () => Array.from(document.querySelectorAll('#file-list .file-row'));
    const names = () => rows().map((r) => {
      const n = r.querySelector('.file-name');
      return (n ? n.textContent : '(ввод)') + (r.classList.contains('folder') ? '/' : '');
    });
    const rowByName = (name) => rows().find((r) => {
      const n = r.querySelector('.file-name');
      return n && n.textContent === name;
    });
    const indentOf = (name) => {
      const row = rowByName(name);
      return row ? parseInt(row.querySelector('.file-main-button').style.paddingLeft, 10) : -1;
    };
    const statusText = () => {
      const node = document.querySelector('#status-line .status-text');
      return node ? node.textContent : '';
    };
    async function menuAction(row, label) {
      row.querySelector('.file-menu-button').click();
      await sleep(60);
      const button = Array.from(document.querySelectorAll('#file-context-menu button'))
        .find((b) => b.textContent === label);
      if (!button) return false;
      button.click();
      await sleep(200);
      return true;
    }
    async function commitName(name) {
      await sleep(60);
      const input = document.querySelector('.file-name-input');
      if (!input) return false;
      input.value = name;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      await sleep(150);
      return true;
    }

    check('приложение открылось без хранилища', rows().length > 0, names().join(' | '));
    check('справка на месте', Boolean(rowByName('добро-пожаловать.md')), names().join(' | '));
    check('пользователь предупреждён', /IndexedDB недоступен/.test(statusText()), statusText());

    el('mode-editor-button').click();
    await sleep(150);
    el('editor').value = '# Пишем без хранилища\n\nТекст держится в памяти.\n';
    el('editor').dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(600);
    el('mode-preview-button').click();
    await sleep(250);
    check('писать и смотреть всё равно можно',
      /Пишем без хранилища/.test(el('preview-body').textContent),
      el('preview-body').textContent.slice(0, 50));

    el('new-folder-button').click();
    await commitName('папка-без-базы');
    check('и заводить папки тоже', Boolean(rowByName('папка-без-базы')), names().join(' | '));

    // ================= скачивание справки =================
    step('скачивание справки');
    capturedBlob = null; capturedName = null;
    const okGhostDownload = await menuAction(rowByName('добро-пожаловать.md'), 'Скачать');
    check('в меню справки есть «Скачать»', okGhostDownload);
    check('справка отдана под своим именем', capturedName === 'добро-пожаловать.md',
      String(capturedName));
    const ghostText = capturedBlob ? await capturedBlob.text() : '';
    check('отдано содержимое справки', /Пишем без хранилища/.test(ghostText),
      JSON.stringify(ghostText.slice(0, 50)));

    // ================= переименование папки =================
    step('переименование папки с содержимым');
    await menuAction(rowByName('папка-без-базы'), 'Новый файл здесь');
    await commitName('внутренний.md');
    check('файл лежит в папке', indentOf('внутренний.md') > indentOf('папка-без-базы'),
      names().join(' | '));

    const okFolderRename = await menuAction(rowByName('папка-без-базы'), 'Переименовать');
    check('в меню папки есть «Переименовать»', okFolderRename);
    await commitName('переименованная-папка');
    check('папка переименована', Boolean(rowByName('переименованная-папка')), names().join(' | '));
    check('содержимое осталось внутри неё',
      Boolean(rowByName('внутренний.md'))
      && indentOf('внутренний.md') > indentOf('переименованная-папка'),
      names().join(' | '));

    // ================= кнопка «Код» в панели =================
    step('панель: строчный код');
    el('mode-editor-button').click();
    await sleep(150);
    const editor = el('editor');
    editor.value = 'выделить';
    editor.dispatchEvent(new Event('input', { bubbles: true }));
    editor.focus();
    editor.setSelectionRange(0, 8);
    const codeButton = Array.from(document.querySelectorAll('#editor-toolbar button'))
      .find((b) => (b.getAttribute('aria-label') || '') === 'Код (Ctrl+`)');
    check('кнопка «Код» есть в панели', Boolean(codeButton));
    codeButton.click();
    await sleep(120);
    check('кнопка «Код» обернула выделение', editor.value === '`выделить`',
      JSON.stringify(editor.value));

    // ================= кнопки панели не крадут фокус =================
    step('кнопки панели не уводят фокус');
    const paintButton = Array.from(document.querySelectorAll('#editor-toolbar button'))
      .find((b) => (b.getAttribute('aria-label') || '') === 'Подсветка разметки в редакторе');
    check('кнопка подсветки есть', Boolean(paintButton));
    check('кнопка подсветки гасит mousedown',
      !paintButton.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true })));

    const toggleButton = document.querySelector('#editor-toolbar .toolbar-toggle');
    check('кнопка сворачивания гасит mousedown',
      !toggleButton.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true })));

    // ================= хранилище вернулось =================
    // Без базы каждая запись падает и оставляет липкое сообщение об ошибке,
    // поэтому дальнейшие проверки строки состояния делаем уже с рабочим хранилищем.
    step('хранилище вернулось');
    Object.defineProperty(window, 'indexedDB', { configurable: true, value: realIndexedDB });
    el('mode-editor-button').click();
    await sleep(150);
    el('editor').value = '# После возвращения базы\n\nтекст\n';
    el('editor').dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(1000);
    check('после возвращения базы запись проходит',
      !el('doc-save').classList.contains('dirty'), el('doc-save').textContent);

    const restored = await new Promise((resolve) => {
      const request = realIndexedDB.open('mdeditor');
      request.onsuccess = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains('files')) { db.close(); resolve([]); return; }
        const r = db.transaction('files', 'readonly').objectStore('files').getAll();
        r.onsuccess = () => { db.close(); resolve(r.result || []); };
      };
      request.onerror = () => resolve([]);
    });
    check('накопленное за время простоя дописано в базу', restored.length >= 1,
      'записей: ' + restored.length + ' → ' + JSON.stringify(restored.map((f) => f.name)));

    // ================= строка состояния сама возвращается =================
    step('строка состояния сбрасывается сама');
    capturedBlob = null;
    await menuAction(rowByName('внутренний.md'), 'Дублировать');
    check('после действия в строке состояния сообщение',
      /Создана копия/.test(statusText()), statusText());
    await sleep(4500);
    check('через несколько секунд строка возвращается к обычной надписи',
      /Файлы хранятся в вашем браузере/.test(statusText()), statusText());

    // ================= предложение отмены не висит вечно =================
    step('предложение отмены истекает');
    await menuAction(rowByName('внутренний (копия).md'), 'Удалить');
    await sleep(80);
    const deleteButton = Array.from(el('dialog-buttons').querySelectorAll('button'))
      .find((b) => b.textContent === 'Удалить');
    deleteButton.click();
    await sleep(200);
    check('сразу после удаления отмена предложена',
      Boolean(document.querySelector('#status-line .status-action')), statusText());

    // окно отмены — 12 секунд; ждём с запасом
    await sleep(13000);
    check('по истечении окна кнопка отмены исчезает',
      !document.querySelector('#status-line .status-action'), statusText());

    const beforeUndoAttempt = names().length;
    check('файл после истечения окна не возвращается',
      !rowByName('внутренний (копия).md'), names().join(' | '));
    check('дерево осталось прежним', names().length === beforeUndoAttempt);

    out.push('');
    out.push('ИТОГО: ' + passed + ' пройдено, ' + failed + ' провалено');
    flush();
    document.title = failed === 0 ? 'ALL-PASS' : 'FAILURES-' + failed;
  })().catch((error) => {
    document.getElementById('results').textContent += '\nИСКЛЮЧЕНИЕ: ' + (error && error.stack || error);
    document.title = 'FAILURES-CRASH';
  });
  </script>
</body>
</html>
