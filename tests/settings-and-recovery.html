<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>MDEditor — настройки и восстановление</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="app-header">
    <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-expanded="false">≡</button>
    <div class="brand"><span class="brand-mark">MD</span><h1>MD</h1></div>
    <div class="segmented">
      <button type="button" id="mode-preview-button">Просмотр</button>
      <button type="button" id="mode-split-button">Вместе</button>
      <button type="button" id="mode-editor-button">Редактор</button>
    </div>
    <div class="doc-bar">
      <span id="doc-path" class="doc-path"></span>
      <span id="doc-save" class="doc-save"></span>
      <span id="doc-stats" class="doc-stats"></span>
    </div>
    <div class="header-settings">
      <select id="preview-font-select"><option value="Lato">Lato</option><option value="Inter">Inter</option><option value="Roboto">Roboto</option><option value="Liberation Sans">Liberation Sans</option><option value="Liberation Serif">Liberation Serif</option></select>
      <button type="button" id="preview-size-dec">−</button><span id="preview-size-value">17</span>
      <button type="button" id="preview-size-inc">+</button>
      <button type="button" id="editor-size-dec">−</button><span id="editor-size-value">14</span>
      <button type="button" id="editor-size-inc">+</button>
      <button type="button" id="theme-button" class="header-icon"></button>
      <button type="button" id="toc-button"><span>Оглавление</span></button>
      <button type="button" id="copy-doc-button"><span>Текст</span></button>
      <button type="button" id="download-zip-button"><span>ZIP</span></button>
    </div>
  </header>

  <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="pane-title"><span>Файлы</span>
        <div class="pane-actions">
          <button type="button" id="new-file-button">+</button>
          <button type="button" id="new-folder-button">D+</button>
          <button type="button" id="delete-all-button">X</button>
          <button type="button" id="upload-button">↑</button>
        </div>
      </div>
      <div class="file-search"><input id="file-search-input" type="search"></div>
      <div id="file-list" class="file-list"></div>
      <div class="sidebar-footer"><span id="status-line">…</span></div>
    </aside>
    <div id="sidebar-resizer" class="sidebar-resizer" tabindex="0" role="separator"
         aria-orientation="vertical" aria-label="Ширина панели файлов"
         aria-valuemin="210" aria-valuemax="520" aria-valuenow="280"></div>
    <main class="content" id="content">
      <div id="editor-pane" class="editor-pane" hidden>
        <div id="editor-toolbar" class="editor-toolbar" role="toolbar"></div>
        <div class="editor-surface">
          <pre id="editor-highlight" class="editor-highlight" aria-hidden="true"></pre>
          <textarea id="editor"></textarea>
        </div>
      </div>
      <div id="split-resizer" class="split-resizer" hidden></div>
      <div id="preview-pane" class="preview-pane"><div id="preview-body" class="markdown-body"></div></div>
      <aside id="toc-panel" class="toc-panel" hidden>
        <div class="toc-title">Оглавление</div><nav id="toc-list" class="toc-list"></nav>
      </aside>
      <div id="welcome-pane" class="welcome-pane" hidden><div class="welcome-card"></div></div>
    </main>
  </div>

  <div id="find-bar" class="find-bar" hidden>
    <input id="find-input" type="search">
    <span id="find-count" class="find-count"></span>
    <button type="button" id="find-prev">↑</button>
    <button type="button" id="find-next">↓</button>
    <button type="button" id="find-close">✕</button>
  </div>
  <div id="file-context-menu" class="context-menu" hidden></div>
  <div id="dialog-overlay" class="dialog-overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true">
      <p id="dialog-message"></p><div id="dialog-buttons" class="dialog-buttons"></div>
    </div>
  </div>
  <input id="upload-input" type="file" multiple hidden>
  <pre id="results" style="position:fixed;left:-99999px"></pre>
  <div id="host" style="position:fixed;left:-99999px;top:0"></div>

  <script src="../vendor/marked.min.js"></script>
  <script>
  (async () => {
    const out = []; let passed = 0, failed = 0;
    const flush = () => { document.getElementById('results').textContent = out.join('\n'); };
    const check = (name, ok, detail) => {
      ok ? passed++ : failed++;
      out.push((ok ? 'PASS  ' : 'FAIL  ') + name + (ok || !detail ? '' : '\n        → ' + detail));
      flush();
    };
    const step = (label) => { out.push('.. ' + label); flush(); };
    const el = (id) => document.getElementById(id);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    window.addEventListener('error', (e) => { out.push('ОШИБКА: ' + e.message); flush(); });

    const OLD = '2020-01-01T00:00:00.000Z';
    const NEW = '2030-01-01T00:00:00.000Z';

    function wipeDb() {
      return new Promise((resolve) => {
        const request = indexedDB.deleteDatabase('mdeditor');
        request.onsuccess = request.onerror = request.onblocked = () => resolve();
      });
    }

    // Кладём в базу состояние схемы v3 напрямую, чтобы проверить, как приложение
    // его поднимет: испорченные записи, потерянных родителей, аварийный снимок.
    function seedWorkspace(files, meta) {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('mdeditor', 2);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains('workspace')) db.createObjectStore('workspace');
          if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
        };
        request.onsuccess = () => {
          const db = request.result;
          const tx = db.transaction(['files', 'meta'], 'readwrite');
          for (const file of files) tx.objectStore('files').put(file);
          tx.objectStore('meta').put(meta, 'meta');
          tx.oncomplete = () => { db.close(); resolve(); };
          tx.onerror = () => { db.close(); reject(tx.error); };
        };
        request.onerror = () => reject(request.error);
      });
    }

    await wipeDb();
    try {
      localStorage.removeItem('mdeditor-settings');
      localStorage.removeItem('mdeditor-emergency');
    } catch {}

    // ---- испорченные настройки и битое состояние на входе ----
    // Приложение обязано подняться, а не встать колом.
    localStorage.setItem('mdeditor-settings', '{это не json');

    await seedWorkspace([
      { id: 'f-ok', name: 'обычный.md', parentId: null, content: '# Обычный\n', updatedAt: OLD },
      { id: 'f-orphan', name: 'сирота.md', parentId: 'нет-такой-папки', content: '# Сирота\n', updatedAt: OLD },
      { id: 'f-old', name: 'правленный.md', parentId: null, content: 'старое содержимое', updatedAt: OLD },
    ], {
      version: 3,
      currentId: 'нет-такого-файла',
      folders: [
        { id: 'dir-ok', name: 'папка', parentId: null },
        { id: 'dir-orphan', name: 'потерянная', parentId: 'тоже-нет' },
        { id: 'dir-broken', parentId: null },
        { name: 'без-идентификатора', parentId: null },
      ],
      expanded: ['dir-ok', 'несуществующий-узел'],
      welcome: null,
      savedAt: OLD,
    });

    // аварийный снимок новее записи в базе — должен подхватиться
    localStorage.setItem('mdeditor-emergency', JSON.stringify({
      version: 3,
      file: { id: 'f-old', name: 'правленный.md', parentId: null,
              content: 'СОДЕРЖИМОЕ ИЗ АВАРИЙНОГО СНИМКА', updatedAt: NEW },
      savedAt: NEW,
    }));

    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = '../js/app.js';
      script.onload = resolve; script.onerror = reject;
      document.body.appendChild(script);
    });
    for (let i = 0; i < 80 && el('file-list').children.length === 0; i++) await sleep(50);
    await sleep(400);

    const rows = () => Array.from(document.querySelectorAll('#file-list .file-row'));
    const names = () => rows().map((r) => {
      const n = r.querySelector('.file-name');
      return (n ? n.textContent : '(ввод)') + (r.classList.contains('folder') ? '/' : '');
    });
    const rowByName = (name) => rows().find((r) => {
      const n = r.querySelector('.file-name');
      return n && n.textContent === name;
    });
    const indentOf = (name) => {
      const row = rowByName(name);
      return row ? parseInt(row.querySelector('.file-main-button').style.paddingLeft, 10) : -1;
    };
    const cssVar = (name) => getComputedStyle(document.documentElement)
      .getPropertyValue(name).trim();

    // ================= подъём испорченного состояния =================
    step('подъём испорченного состояния');
    check('приложение поднялось, а не встало', rows().length > 0, names().join(' | '));
    check('битые настройки не помешали: гарнитура сброшена на умолчание',
      el('preview-font-select').value === 'Lato', el('preview-font-select').value);
    check('целый файл на месте', Boolean(rowByName('обычный.md')), names().join(' | '));
    check('целая папка на месте', Boolean(rowByName('папка')), names().join(' | '));

    check('файл с потерянным родителем поднят в корень',
      Boolean(rowByName('сирота.md')) && indentOf('сирота.md') === 10,
      'отступ ' + indentOf('сирота.md') + ', дерево: ' + names().join(' | '));
    check('папка с потерянным родителем поднята в корень',
      Boolean(rowByName('потерянная')) && indentOf('потерянная') === 10,
      'отступ ' + indentOf('потерянная'));
    check('записи папок без имени или идентификатора отброшены',
      !rowByName('без-идентификатора') && rows().filter((r) => r.classList.contains('folder')).length === 2,
      names().join(' | '));
    check('несуществующий текущий файл заменён на первый доступный',
      Boolean(document.querySelector('#file-list .file-row.active')),
      names().join(' | '));

    step('аварийный снимок');
    rowByName('правленный.md').querySelector('.file-main-button').click();
    await sleep(300);
    check('снимок новее базы подхвачен',
      /СОДЕРЖИМОЕ ИЗ АВАРИЙНОГО СНИМКА/.test(el('preview-body').textContent),
      el('preview-body').textContent.slice(0, 60));
    check('снимок из localStorage убран после применения',
      localStorage.getItem('mdeditor-emergency') === null,
      String(localStorage.getItem('mdeditor-emergency')).slice(0, 40));

    await sleep(600);
    const stored = await new Promise((resolve) => {
      const request = indexedDB.open('mdeditor');
      request.onsuccess = () => {
        const db = request.result;
        const r = db.transaction('files', 'readonly').objectStore('files').get('f-old');
        r.onsuccess = () => { db.close(); resolve(r.result); };
      };
    });
    check('восстановленное из снимка дописано и в базу',
      stored && /АВАРИЙНОГО СНИМКА/.test(stored.content), JSON.stringify(stored && stored.content));

    // ================= настройки просмотра =================
    step('гарнитура и кегль');
    el('preview-font-select').value = 'Liberation Serif';
    el('preview-font-select').dispatchEvent(new Event('change', { bubbles: true }));
    await sleep(150);
    check('смена гарнитуры применяется к превью',
      cssVar('--preview-font').includes('Liberation Serif'), cssVar('--preview-font'));

    const sizeBefore = parseInt(cssVar('--preview-size'), 10);
    el('preview-size-inc').click();
    await sleep(80);
    check('кегль просмотра увеличивается',
      parseInt(cssVar('--preview-size'), 10) === sizeBefore + 1, cssVar('--preview-size'));
    check('значение показано в шапке', el('preview-size-value').textContent === String(sizeBefore + 1),
      el('preview-size-value').textContent);

    for (let i = 0; i < 40; i++) el('preview-size-inc').click();
    await sleep(120);
    check('кегль просмотра не уходит выше предела',
      parseInt(cssVar('--preview-size'), 10) === 28, cssVar('--preview-size'));
    for (let i = 0; i < 60; i++) el('preview-size-dec').click();
    await sleep(120);
    check('и не уходит ниже предела',
      parseInt(cssVar('--preview-size'), 10) === 12, cssVar('--preview-size'));

    for (let i = 0; i < 40; i++) el('editor-size-dec').click();
    await sleep(120);
    check('кегль редактора тоже ограничен снизу',
      parseInt(cssVar('--editor-size'), 10) === 10, cssVar('--editor-size'));

    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('mdeditor-settings')); } catch {}
    check('настройки сохранены и снова читаются',
      saved && saved.previewFont === 'Liberation Serif' && saved.previewSize === 12
      && saved.editorSize === 10,
      JSON.stringify(saved));

    // ================= ширина панели мышью =================
    step('ширина панели мышью');
    const resizer = el('sidebar-resizer');
    resizer.setPointerCapture = () => {};
    resizer.releasePointerCapture = () => {};
    const widthBefore = parseInt(cssVar('--sidebar-width'), 10);
    resizer.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 3, clientX: widthBefore }));
    resizer.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 3, clientX: 400 }));
    resizer.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 3 }));
    await sleep(150);
    check('перетаскивание меняет ширину', parseInt(cssVar('--sidebar-width'), 10) === 400,
      cssVar('--sidebar-width'));

    resizer.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 4, clientX: 400 }));
    resizer.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 4, clientX: 9999 }));
    resizer.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 4 }));
    await sleep(150);
    check('ширина ограничена сверху', parseInt(cssVar('--sidebar-width'), 10) === 520,
      cssVar('--sidebar-width'));

    resizer.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
    await sleep(150);
    check('двойной клик возвращает ширину по умолчанию',
      parseInt(cssVar('--sidebar-width'), 10) === 280, cssVar('--sidebar-width'));

    // ================= явное сохранение =================
    step('сохранение по Ctrl+S');
    el('mode-editor-button').click();
    await sleep(150);
    el('editor').value = '# Явное сохранение\n\nтекст\n';
    el('editor').dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(60);
    document.dispatchEvent(new KeyboardEvent('keydown',
      { key: 's', ctrlKey: true, bubbles: true, cancelable: true }));
    await sleep(400);
    const statusText = document.querySelector('#status-line .status-text');
    check('Ctrl+S сообщает о сохранении',
      Boolean(statusText) && /Сохранено/.test(statusText.textContent),
      statusText ? statusText.textContent : 'нет строки состояния');
    check('после явного сохранения нет несохранённых',
      !el('doc-save').classList.contains('dirty'), el('doc-save').textContent);

    // ================= очистка поиска по Escape =================
    step('поиск: очистка по Escape');
    el('file-search-input').value = 'обычный';
    el('file-search-input').dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(250);
    check('фильтр применился', rows().length < 5 && Boolean(rowByName('обычный.md')),
      names().join(' | '));
    el('file-search-input').dispatchEvent(new KeyboardEvent('keydown',
      { key: 'Escape', bubbles: true, cancelable: true }));
    await sleep(200);
    check('Escape очищает поле поиска', el('file-search-input').value === '',
      JSON.stringify(el('file-search-input').value));
    check('и возвращает всё дерево', rows().length >= 5, names().join(' | '));

    // ================= курсив кнопкой панели =================
    step('панель: курсив');
    const editor = el('editor');
    editor.value = 'наклонить';
    editor.dispatchEvent(new Event('input', { bubbles: true }));
    editor.focus();
    editor.setSelectionRange(0, 9);
    const italicButton = Array.from(document.querySelectorAll('#editor-toolbar button'))
      .find((b) => (b.getAttribute('aria-label') || '') === 'Курсив (Ctrl+I)');
    check('кнопка курсива есть', Boolean(italicButton));
    italicButton.click();
    await sleep(120);
    check('кнопка курсива обернула выделение', editor.value === '*наклонить*',
      JSON.stringify(editor.value));

    // ================= запасной путь копирования =================
    step('копирование без clipboard API');
    let execCopyCalls = 0;
    const realExec = document.execCommand.bind(document);
    document.execCommand = (command, ...rest) => {
      if (command === 'copy') { execCopyCalls += 1; return true; }
      return realExec(command, ...rest);
    };
    Object.defineProperty(navigator, 'clipboard', { configurable: true, value: undefined });

    editor.value = '```js\nconst x = 1;\n```\n';
    editor.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(200);
    el('mode-preview-button').click();
    await sleep(300);
    const copyButton = document.querySelector('#preview-body .code-copy');
    check('кнопка копирования кода есть', Boolean(copyButton));
    if (copyButton) {
      copyButton.click();
      await sleep(200);
      check('без clipboard API используется запасной путь через textarea',
        execCopyCalls === 1, 'вызовов execCommand("copy"): ' + execCopyCalls);
      check('кнопка показала успех', copyButton.classList.contains('copied'));
      await sleep(1800);
      check('через полторы секунды кнопка возвращается в исходный вид',
        !copyButton.classList.contains('copied'), copyButton.className);
    }
    document.execCommand = realExec;

    // ================= якорь заголовка =================
    step('переход по якорю заголовка');
    el('mode-editor-button').click();
    await sleep(120);
    // после последнего заголовка нужен объём, иначе панель упрётся в конец
    // прокрутки и подвести заголовок к самому верху будет физически некуда
    editor.value = '# Первый\n\n' + 'абзац\n\n'.repeat(60)
      + '## Последний\n\n' + 'хвост\n\n'.repeat(60);
    editor.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(200);
    el('mode-preview-button').click();
    await sleep(350);
    el('preview-pane').scrollTop = 0;
    await sleep(60);
    const anchors = Array.from(document.querySelectorAll('.heading-anchor'));
    check('у заголовков есть якоря', anchors.length === 2, 'найдено: ' + anchors.length);
    anchors[1].click();
    await sleep(250);
    check('нажатие на якорь подводит раздел к верху',
      el('preview-pane').scrollTop > 0
      && Math.abs(anchors[1].closest('h2').getBoundingClientRect().top
                  - el('preview-pane').getBoundingClientRect().top) < 40,
      'прокрутка ' + Math.round(el('preview-pane').scrollTop));

    // ================= закрытие поиска из поля ввода =================
    step('поиск в документе: Escape в поле');
    document.dispatchEvent(new KeyboardEvent('keydown',
      { key: 'f', ctrlKey: true, bubbles: true, cancelable: true }));
    await sleep(150);
    check('строка поиска открыта', !el('find-bar').hidden);
    el('find-input').dispatchEvent(new KeyboardEvent('keydown',
      { key: 'Escape', bubbles: true, cancelable: true }));
    await sleep(150);
    check('Escape в поле поиска закрывает строку', el('find-bar').hidden);

    out.push('');
    out.push('ИТОГО: ' + passed + ' пройдено, ' + failed + ' провалено');
    flush();
    document.title = failed === 0 ? 'ALL-PASS' : 'FAILURES-' + failed;
  })().catch((error) => {
    document.getElementById('results').textContent += '\nИСКЛЮЧЕНИЕ: ' + (error && error.stack || error);
    document.title = 'FAILURES-CRASH';
  });
  </script>
</body>
</html>
