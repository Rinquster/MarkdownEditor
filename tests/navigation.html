<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>MDEditor — поиск и оглавление</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="brand"><span class="brand-mark">MD</span><h1>MD</h1></div>
    <div class="segmented">
      <button type="button" id="mode-preview-button">Просмотр</button>
      <button type="button" id="mode-split-button">Вместе</button>
      <button type="button" id="mode-editor-button">Редактор</button>
    </div>
    <div class="header-settings">
      <select id="preview-font-select"><option value="Lato">Lato</option><option value="Inter">Inter</option><option value="Roboto">Roboto</option><option value="Liberation Sans">Liberation Sans</option><option value="Liberation Serif">Liberation Serif</option></select>
      <button type="button" id="preview-size-dec">−</button><span id="preview-size-value">17</span>
      <button type="button" id="preview-size-inc">+</button>
      <button type="button" id="editor-size-dec">−</button><span id="editor-size-value">14</span>
      <button type="button" id="editor-size-inc">+</button>
      <button type="button" id="theme-button"></button><span id="doc-path"></span><span id="doc-save"></span><span id="doc-stats"></span><button type="button" id="toc-button"><span>Оглавление</span></button>
      <button type="button" id="copy-doc-button"><span>Текст</span></button>
      <button type="button" id="download-zip-button"><span>ZIP</span></button>
    </div>
  </header>

  <button type="button" id="sidebar-toggle"></button>
  <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="pane-title"><span>Файлы</span>
        <div class="pane-actions">
          <button type="button" id="new-file-button">+</button>
          <button type="button" id="new-folder-button">D+</button>
          <button type="button" id="delete-all-button">X</button>
          <button type="button" id="upload-button">↑</button>
        </div>
      </div>
      <div class="file-search"><input id="file-search-input" type="search"></div>
      <div id="file-list" class="file-list"></div>
      <div class="sidebar-footer"><span id="status-line">…</span></div>
    </aside>
    <div id="sidebar-resizer" class="sidebar-resizer"></div>
    <main class="content" id="content">
      <div id="editor-pane" class="editor-pane" hidden>
        <div id="editor-toolbar" class="editor-toolbar" role="toolbar"></div>
        <div class="editor-surface">
          <pre id="editor-highlight" class="editor-highlight" aria-hidden="true"></pre>
          <textarea id="editor"></textarea>
        </div>
      </div>
      <div id="split-resizer" class="split-resizer" hidden></div>
      <div id="preview-pane" class="preview-pane"><div id="preview-body" class="markdown-body"></div></div>
      <aside id="toc-panel" class="toc-panel" hidden>
        <div class="toc-title">Оглавление</div>
        <nav id="toc-list" class="toc-list"></nav>
      </aside>
      <div id="welcome-pane" class="welcome-pane" hidden><div class="welcome-card"></div></div>
    </main>
  </div>

  <div id="find-bar" class="find-bar" hidden>
    <input id="find-input" type="search">
    <span id="find-count" class="find-count"></span>
    <button type="button" id="find-prev">↑</button>
    <button type="button" id="find-next">↓</button>
    <button type="button" id="find-close">✕</button>
  </div>
  <div id="file-context-menu" class="context-menu" hidden></div>
  <div id="dialog-overlay" class="dialog-overlay" hidden>
    <div class="dialog"><p id="dialog-message"></p><div id="dialog-buttons" class="dialog-buttons"></div></div>
  </div>
  <input id="upload-input" type="file" multiple hidden>
  <pre id="results" style="position:fixed;left:-99999px"></pre>

  <script src="../vendor/marked.min.js"></script>
  <script>
  (async () => {
    const out = []; let passed = 0, failed = 0;
    const flush = () => { document.getElementById('results').textContent = out.join('\n'); };
    const check = (name, ok, detail) => {
      ok ? passed++ : failed++;
      out.push((ok ? 'PASS  ' : 'FAIL  ') + name + (ok || !detail ? '' : '\n        → ' + detail));
      flush();
    };
    const step = (label) => { out.push('.. ' + label); flush(); };
    const el = (id) => document.getElementById(id);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    window.addEventListener('error', (e) => { out.push('ОШИБКА: ' + e.message); flush(); });

    await new Promise((resolve) => {
      const request = indexedDB.deleteDatabase('mdeditor');
      request.onsuccess = request.onerror = request.onblocked = () => resolve();
    });
    try {
      localStorage.removeItem('mdeditor-emergency');
      localStorage.removeItem('mdeditor-settings');
    } catch {}

    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = '../js/app.js';
      script.onload = resolve; script.onerror = reject;
      document.body.appendChild(script);
    });
    for (let i = 0; i < 80 && el('file-list').children.length === 0; i++) await sleep(50);

    // ---- вспомогательное ----
    const rows = () => Array.from(document.querySelectorAll('#file-list .file-row'));
    const names = () => rows().map((r) => {
      const n = r.querySelector('.file-name');
      return (n ? n.textContent : '(ввод)') + (r.classList.contains('folder') ? '/' : '');
    });
    const rowByName = (name) => rows().find((r) => {
      const n = r.querySelector('.file-name');
      return n && n.textContent === name;
    });

    async function search(text) {
      el('file-search-input').value = text;
      el('file-search-input').dispatchEvent(new Event('input', { bubbles: true }));
      await sleep(250);
    }

    function dropEntries(entries) {
      const transfer = {
        types: ['Files'], files: [],
        items: entries.map((entry) => ({ webkitGetAsEntry: () => entry })),
      };
      const event = new DragEvent('drop', { bubbles: true, cancelable: true });
      Object.defineProperty(event, 'dataTransfer', { value: transfer });
      el('file-list').dispatchEvent(event);
    }
    const fileEntry = (fullPath, content) => ({
      isFile: true, isDirectory: false, name: fullPath.split('/').pop(), fullPath,
      file(resolve) { resolve(new File([content], fullPath.split('/').pop(), { type: 'text/markdown' })); },
    });
    const dirEntry = (fullPath, children) => ({
      isFile: false, isDirectory: true, name: fullPath.split('/').pop(), fullPath,
      createReader() {
        let served = false;
        return { readEntries(resolve) { if (served) { resolve([]); return; } served = true; resolve(children.slice()); } };
      },
    });

    // ---- готовим дерево ----
    step('готовим дерево из нескольких файлов');
    dropEntries([
      dirEntry('/руководство', [
        fileEntry('/руководство/установка.md', '# Установка\n\nСначала скачайте архив.\n'),
        fileEntry('/руководство/настройка.md', '# Настройка\n\nОтредактируйте конфигурацию. Конфигурация лежит рядом.\n'),
      ]),
      dirEntry('/черновики', [
        fileEntry('/черновики/идея.md', '# Идея\n\nПросто мысль без ключевого слова.\n'),
      ]),
      fileEntry('/оглавление.md', '# Оглавление\n\nСсылки на разделы.\n'),
    ]);
    await sleep(900);
    check('дерево загружено', names().length >= 6, names().join(' | '));

    // ================= 6.1 поиск по именам =================
    step('ищем по имени');
    await search('настройка');
    check('нашёлся файл по имени', Boolean(rowByName('настройка.md')), names().join(' | '));
    check('его папка показана как предок', Boolean(rowByName('руководство')), names().join(' | '));
    check('посторонние файлы скрыты', !rowByName('идея.md') && !rowByName('оглавление.md'),
      names().join(' | '));
    check('дерево раскрыто, чтобы совпадение было видно',
      Boolean(rowByName('руководство').querySelector('.file-twisty.open')));

    step('ищем по имени папки');
    await search('черновики');
    check('папка найдена', Boolean(rowByName('черновики')), names().join(' | '));
    check('содержимое найденной папки показано целиком', Boolean(rowByName('идея.md')),
      names().join(' | '));

    // ================= 6.4 поиск по содержимому =================
    step('ищем по тексту');
    await search('конфигурац');
    check('файл найден по содержимому', Boolean(rowByName('настройка.md')), names().join(' | '));
    const badge = rowByName('настройка.md').querySelector('.file-hits');
    check('показано число совпадений в тексте', Boolean(badge) && badge.textContent === '2',
      badge ? badge.textContent : 'значка нет');
    check('файлы без совпадений скрыты', !rowByName('установка.md'), names().join(' | '));

    step('запрос без совпадений');
    await search('такогословатутнет');
    check('сообщение «ничего не найдено»',
      /Ничего не найдено/.test(el('file-list').textContent), el('file-list').textContent.slice(0, 60));
    check('строк файлов не осталось', rows().length === 0, names().join(' | '));

    step('очищаем фильтр');
    await search('');
    check('дерево вернулось целиком', names().length >= 6, names().join(' | '));
    check('справка вернулась в список', Boolean(rowByName('добро-пожаловать.md')),
      names().join(' | '));

    // ================= 6.3 оглавление и якоря =================
    step('открываем документ с заголовками');
    const DOC = [
      '# Большой документ', '',
      'Вступление со словом маркер.', '',
      '## Первый раздел', '',
      'Текст первого раздела, снова маркер.', '',
      '### Подраздел', '',
      'Ещё немного текста.', '',
      '## Первый раздел', '',
      'Одноимённый заголовок для проверки.', '',
      '## Последний раздел', '',
      'Хвост документа с третьим словом маркер.',
      ...Array.from({ length: 40 }, (_, i) => '\nЗаполнитель ' + i + '.'),
    ].join('\n');

    rowByName('оглавление.md').querySelector('.file-main-button').click();
    await sleep(150);
    el('mode-editor-button').click();
    await sleep(120);
    el('editor').value = DOC;
    el('editor').dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(200);
    el('mode-preview-button').click();
    await sleep(350);

    const headings = Array.from(el('preview-body').querySelectorAll('h1, h2, h3'));
    check('у всех заголовков есть идентификаторы',
      headings.length === 5 && headings.every((h) => h.id),
      headings.map((h) => h.tagName + '#' + h.id).join(' | '));
    check('одинаковые заголовки получили разные идентификаторы',
      new Set(headings.map((h) => h.id)).size === headings.length,
      headings.map((h) => h.id).join(' | '));
    check('идентификаторы читаемые, а не случайные',
      headings[1].id.includes('первый') && headings[1].id.includes('раздел'),
      headings[1].id);
    check('у заголовка есть ссылка-якорь',
      headings.every((h) => h.querySelector('a.heading-anchor')));

    step('включаем оглавление');
    check('панель оглавления скрыта по умолчанию', el('toc-panel').hidden);
    el('toc-button').click();
    await sleep(250);
    check('панель оглавления показана', !el('toc-panel').hidden);
    const links = Array.from(document.querySelectorAll('#toc-list .toc-link'));
    check('в оглавлении столько же пунктов, сколько заголовков', links.length === 5,
      'пунктов: ' + links.length);
    check('оглавление стоит справа от превью, а не под ним',
      el('toc-panel').getBoundingClientRect().left >= el('preview-pane').getBoundingClientRect().right - 1
      && Math.abs(el('toc-panel').getBoundingClientRect().top - el('preview-pane').getBoundingClientRect().top) < 2,
      'оглавление left=' + Math.round(el('toc-panel').getBoundingClientRect().left)
        + ' top=' + Math.round(el('toc-panel').getBoundingClientRect().top)
        + ', превью right=' + Math.round(el('preview-pane').getBoundingClientRect().right)
        + ' top=' + Math.round(el('preview-pane').getBoundingClientRect().top));
    check('в пунктах оглавления нет решёток от якорей',
      links.every((l) => !l.textContent.includes('#')),
      links.map((l) => l.textContent).join(' | '));
    check('вложенность передана отступом',
      parseInt(links[2].style.paddingLeft, 10) > parseInt(links[1].style.paddingLeft, 10),
      links.map((l) => l.style.paddingLeft).join(' | '));

    step('переход по оглавлению');
    el('preview-pane').scrollTop = 0;
    await sleep(60);
    links[4].click();
    await sleep(200);
    const target = headings[4];
    const offset = target.getBoundingClientRect().top - el('preview-pane').getBoundingClientRect().top;
    check('клик по оглавлению подвёл нужный заголовок к верху',
      Math.abs(offset) < 40 && el('preview-pane').scrollTop > 0,
      'смещение ' + Math.round(offset) + ', прокрутка ' + Math.round(el('preview-pane').scrollTop));

    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('mdeditor-settings')); } catch {}
    check('состояние оглавления сохранено', saved && saved.toc === true,
      JSON.stringify(saved && saved.toc));

    // ================= 6.2 поиск внутри документа =================
    step('поиск в режиме просмотра');
    check('строка поиска скрыта до вызова', el('find-bar').hidden);
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'f', ctrlKey: true, bubbles: true, cancelable: true }));
    await sleep(150);
    check('Ctrl+F открыл строку поиска', !el('find-bar').hidden);

    el('find-input').value = 'маркер';
    el('find-input').dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(250);

    const hits = Array.from(el('preview-body').querySelectorAll('mark.find-hit'));
    check('совпадения отмечены в превью', hits.length === 3, 'найдено: ' + hits.length);
    check('счётчик показывает позицию и общее число', /1 из 3/.test(el('find-count').textContent),
      el('find-count').textContent);
    check('текущее совпадение выделено особо',
      el('preview-body').querySelectorAll('mark.find-hit.current').length === 1);

    check('строка поиска не накрывает оглавление',
      el('find-bar').getBoundingClientRect().right <= el('toc-panel').getBoundingClientRect().left + 1,
      'поиск right=' + Math.round(el('find-bar').getBoundingClientRect().right)
        + ', оглавление left=' + Math.round(el('toc-panel').getBoundingClientRect().left));

    step('переход по совпадениям');
    el('find-next').click();
    await sleep(150);
    check('кнопка «дальше» сдвинула счётчик', /2 из 3/.test(el('find-count').textContent),
      el('find-count').textContent);
    const currentNow = el('preview-body').querySelector('mark.find-hit.current');
    check('текущим стало второе совпадение', currentNow === hits[1]);

    el('find-prev').click();
    await sleep(150);
    check('кнопка «назад» вернула счётчик', /1 из 3/.test(el('find-count').textContent),
      el('find-count').textContent);

    el('find-next').click(); el('find-next').click(); el('find-next').click();
    await sleep(200);
    check('после последнего совпадения счётчик замыкается на первое',
      /1 из 3/.test(el('find-count').textContent), el('find-count').textContent);

    step('запрос без совпадений в документе');
    el('find-input').value = 'ничегоподобного';
    el('find-input').dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(200);
    check('сообщается об отсутствии совпадений',
      /нет совпадений/.test(el('find-count').textContent), el('find-count').textContent);
    check('старые метки сняты',
      el('preview-body').querySelectorAll('mark.find-hit').length === 0);

    step('поиск в редакторе');
    el('find-input').value = 'маркер';
    el('find-input').dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(200);
    el('mode-editor-button').click();
    await sleep(400);
    const layerHits = el('editor-highlight').querySelectorAll('mark.find-hit');
    check('совпадения отмечены в слое подсветки редактора', layerHits.length === 3,
      'найдено: ' + layerHits.length);
    check('в превью меток не осталось',
      el('preview-body').querySelectorAll('mark.find-hit').length === 0);

    step('закрытие поиска');
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
    await sleep(150);
    check('Escape закрыл строку поиска', el('find-bar').hidden);
    check('все метки сняты',
      el('editor-highlight').querySelectorAll('mark.find-hit').length === 0
      && el('preview-body').querySelectorAll('mark.find-hit').length === 0);
    check('текст слоя снова дословно равен тексту поля',
      el('editor-highlight').textContent === el('editor').value
      || el('editor-highlight').textContent === el('editor').value + '\n',
      'длина слоя ' + el('editor-highlight').textContent.length
        + ', поля ' + el('editor').value.length);

    out.push('');
    out.push('ИТОГО: ' + passed + ' пройдено, ' + failed + ' провалено');
    flush();
    document.title = failed === 0 ? 'ALL-PASS' : 'FAILURES-' + failed;
  })().catch((error) => {
    document.getElementById('results').textContent += '\nИСКЛЮЧЕНИЕ: ' + (error && error.stack || error);
    document.title = 'FAILURES-CRASH';
  });
  </script>
</body>
</html>
